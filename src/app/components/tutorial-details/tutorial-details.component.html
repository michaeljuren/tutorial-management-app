<div class="tutorial-details" *ngIf="viewMode; else editable">
  <div *ngIf="currentTutorial.id" class="tutorial-info">
    <h4>Tutorial</h4>
    <div>
      <label><strong>Title:</strong></label> {{ currentTutorial.title }}
    </div>
    <div>
      <label><strong>Description:</strong></label>
      {{ currentTutorial.description }}
    </div>
    <div>
      <label><strong>Status:</strong></label>
      <span class="status-badge" [class.status-published]="currentTutorial.published" [class.status-pending]="!currentTutorial.published">
        {{ currentTutorial.published ? "Published" : "Pending" }}
      </span>
    </div>

    <div class="button-group">
      <a
        class="badge badge-warning"
        [routerLink]="['/tutorials', currentTutorial.id]"
      >Edit</a>
    </div>
  </div>

  <div *ngIf="!currentTutorial" class="empty-state">
    <p>Please click on a Tutorial...</p>
  </div>
</div>

<ng-template #editable>
  <div class="tutorial-details">
    <div *ngIf="currentTutorial.id" class="edit-form">
      <h4>Tutorial</h4>
      <form>
        <div class="form-group">
          <label for="title">Title</label>
          <input
            type="text"
            class="form-control"
            id="title"
            [(ngModel)]="currentTutorial.title"
            name="title"
          />
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <input
            type="text"
            class="form-control"
            id="description"
            [(ngModel)]="currentTutorial.description"
            name="description"
          />
        </div>

        <div class="form-group">
          <label><strong>Status:</strong></label>
          <span class="status-badge" [class.status-published]="currentTutorial.published" [class.status-pending]="!currentTutorial.published">
            {{ currentTutorial.published ? "Published" : "Pending" }}
          </span>
        </div>
      </form>

      <div class="button-group">
        <button
          *ngIf="currentTutorial.published"
          class="badge badge-primary mr-2"
          (click)="updatePublished(false)"
        >
          Unpublish
        </button>
        <button
          *ngIf="!currentTutorial.published"
          class="badge badge-primary mr-2"
          (click)="updatePublished(true)"
        >
          Publish
        </button>

        <button
          class="badge badge-danger mr-2"
          (click)="deleteTutorial()"
        >
          Delete
        </button>

        <button
          type="submit"
          class="badge badge-success mb-2"
          (click)="updateTutorial()"
        >
          Update
        </button>
      </div>

      <p *ngIf="message" class="message" [class.success]="message.includes('success')" [class.error]="message.includes('error')">
        {{ message }}
      </p>
    </div>

    <div *ngIf="!currentTutorial.id" class="empty-state">
      <p>Cannot access this Tutorial...</p>
    </div>
  </div>
</ng-template>
